services:
  solace:
    image: 'solace/solace-pubsub-standard:latest'
    container_name: solace-broker
    ports:
      - '55554:55555'
      - '8080:8080'
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=admin
    shm_size: 1g
    ulimits:
      nofile:
        soft: 2448
        hard: 1048576

  # Demo-only stand-in for your real target. Remove this service (and its depends_on
  # entry below) if you're adapting this file for your own deployment.
  mock-target:
    build: ./mock-target
    container_name: oauth2-client-credentials-mock-target
    ports:
      - '8081:8080'

  bridge:
    build: ../../bridge
    container_name: oauth2-client-credentials-bridge
    ports:
      - '9797:9797'
    volumes:
      - ./docker-config.toml:/app/Config.toml:ro
    depends_on:
      - solace
      - mock-target   # remove along with the service above for your own deployment
    restart: on-failure
