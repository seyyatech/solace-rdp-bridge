# The bridge's Config.toml for this sample - bind-mounted by docker-compose.yaml, so editing this
# file and running `docker compose restart bridge` (no --build) picks up a change.
[solace_rdp_plus.bridge]
queueName = "bridge-demo-queue"
targetUrl = "http://mock-target:8080/deliver"
targetHeaders = { }

# Route 2 is configured identically to route 1 - the bridge always runs two routes (see
# ../../bridge/README.md), and this sample is about resilience, not multi-target routing.
queueName2 = "bridge-demo-queue-2"
targetUrl2 = "http://mock-target:8080/deliver"
targetHeaders2 = { }

# Demo-friendly retry/circuit-breaker values - a few seconds total, not production tuning.
requestTimeout = 5
retryCount = 3
retryInterval = 1
retryBackOffFactor = 2.0
retryMaxWaitInterval = 10

circuitBreakerRequestVolumeThreshold = 3
circuitBreakerTimeWindow = 120
circuitBreakerBucketSize = 30
circuitBreakerFailureThreshold = 0.5
circuitBreakerResetTime = 20

circuitOpenNackDelay = 1
