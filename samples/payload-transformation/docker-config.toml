# The bridge's Config.toml for this sample - bind-mounted by docker-compose.yaml.
[solace_rdp_bridge.bridge]
queueName = "bridge-demo-queue"
targetUrl = "http://mock-target:8080/deliver"
targetHeaders = { }

# The transformation this sample demonstrates: renames workerId -> employeeId and eventType ->
# action, adds source as enrichment, stamps processedAt, and promotes action to the X-Event-Type
# header. Anything else in the payload (like department, in this sample's example) passes through
# untouched. See ../../bridge/README.md's Payload transformation section for the full reference.
transformFieldRenames = { workerId = "employeeId", eventType = "action" }
transformStaticFields = { source = "solace-delivery-bridge" }
transformTimestampField = "processedAt"
transformHeaderFields = { X-Event-Type = "action" }

# Prometheus-style metrics - uncomment to expose them at :9797/metrics. See
# ../../bridge/README.md's Metrics section.
# [ballerina.observe]
# metricsEnabled = true
# metricsReporter = "prometheus"
#
# [ballerinax.prometheus]
# port = 9797
# host = "0.0.0.0"
